name: zcord
description: "Discord analog"
publish_to: 'none' # Удалите эту строку, если хотите опубликовать на pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.7
  http: 0.13.6
  cupertino_icons: ^1.0.8
  awesome_dialog: ^3.2.1
  cloud_firestore: ^5.6.1
  shared_preferences: ^2.3.5
  image_picker: ^1.1.2
  shelf: ^1.4.1
  shelf_web_socket: ^1.0.4
  intl: ^0.19.0
  emoji_picker_flutter: ^4.3.0
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true
  fonts:
    - family: YesevaOne
      fonts:
        - asset: assets/fonts/YesevaOne-Regular.ttf
  assets:
    - assets/zcord_logo.png
    - assets/lang/
    - assets/default_avatar.png
    # or if you're using a subdirectory:
    # - assets/images/default_avatar.png
